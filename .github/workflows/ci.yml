name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true
      - name: Run unit tests
        run: go test ./...

  integration:
    name: Integration tests (JA4 fingerprint verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true
      - name: Run integration tests
        run: go test -tags integration -v -count=1 ./proxy/... ./fingerprint/...
